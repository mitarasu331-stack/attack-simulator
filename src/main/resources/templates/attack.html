<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>認証攻撃実験</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f6f8;
            color: #333;
            font-family:
                "Segoe UI",
                "Yu Gothic",
                "Meiryo",
                sans-serif;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 35px;
        }

        .section {
            background-color: #ffffff;
            padding: 30px;
            margin-bottom: 25px;
            border-radius: 10px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .section-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 25px;
            padding-left: 12px;
            border-left: 5px solid #333;
        }

        .form-group {
            margin-bottom: 22px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
            background-color: white;
        }

        input[type="text"]:focus,
        select:focus {
            outline: none;
            border-color: #333;
        }

        .description {
            margin-top: 8px;
            color: #777;
            font-size: 13px;
            line-height: 1.6;
        }

        .auth-description {
            margin-top: 15px;
            padding: 15px;
            background-color: #f1f3f5;
            border-radius: 6px;
            line-height: 1.7;
            font-size: 14px;
        }

        .button-area {
            margin-top: 30px;
            text-align: center;
        }

        button {
            border: none;
            border-radius: 7px;
            padding: 13px 40px;
            font-size: 16px;
            cursor: pointer;
            background-color: #333;
            color: white;
        }

        button:hover {
            background-color: #555;
        }

        .results-button {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            border-radius: 7px;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .results-button:hover {
            background-color: #5c636a;
        }

        .otp-area {
            display: none;
        }

    </style>

</head>


<body>

<div class="container">

    <h1>認証攻撃実験</h1>


    <!-- ================================== -->
    <!-- パスワード総当たり -->
    <!-- ================================== -->

    <div class="section">

        <div class="section-title">
            パスワード総当たり
        </div>


        <form
            id="attackForm"
            method="post">


            <!-- ============================== -->
            <!-- 実験対象ユーザー名 -->
            <!-- ============================== -->

            <div class="form-group">

                <label for="username">
                    実験対象ユーザー名
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="実験対象ユーザー名を入力してください"
                    required>

                <div class="description">
                    攻撃対象となるユーザー名を入力してください。
                </div>

            </div>


            <!-- ============================== -->
            <!-- 認証方式 -->
            <!-- ============================== -->

            <div class="form-group">

                <label for="authMethod">
                    認証方式
                </label>

                <select
                    id="authMethod"
                    name="authMethod"
                    onchange="changeAuthentication()"
                    required>

                    <option
                        value=""
                        selected
                        disabled>

                        認証方式を選択してください

                    </option>


                    <!-- ====================== -->
                    <!-- 一段階～三段階 -->
                    <!-- ====================== -->

                    <option value="one-stage">
                        一段階認証
                    </option>

                    <option value="two-stage">
                        二段階認証
                    </option>

                    <option value="three-stage">
                        三段階認証
                    </option>


                    <!-- ====================== -->
                    <!-- 一要素・二要素 -->
                    <!-- ====================== -->

                    <option value="one-factor-password">
                        一要素認証（Password）
                    </option>

                    <option value="one-factor-email-otp">
                        一要素認証（Email OTP）
                    </option>

                    <option value="two-factor-password-email-otp">
                        二要素認証（Password + Email OTP）
                    </option>

                </select>


                <div
                    id="authDescription"
                    class="auth-description">

                    認証方式を選択すると、
                    認証構成が表示されます。

                </div>

            </div>


            <!-- ============================== -->
            <!-- メールOTP最大試行回数 -->
            <!-- ============================== -->

            <div
                id="otpArea"
                class="form-group otp-area">

                <label for="maxAttempts">
                    Email OTP 最大攻撃試行回数
                </label>

                <input
                    type="text"
                    id="maxAttempts"
                    name="maxAttempts"
                    value="10000">

                <div class="description">
                    Email OTPは6桁の数字を総当たりします。
                    最大攻撃試行回数を指定してください。
                </div>

            </div>


            <!-- ============================== -->
            <!-- 開始ボタン -->
            <!-- ============================== -->

            <div class="button-area">

                <button
                    type="submit">

                    攻撃実験を開始

                </button>

                <br>

                <a
                    href="/results"
                    class="results-button">

                    実験結果を見る

                </a>

            </div>

        </form>

    </div>

</div>


<script>

    /**
     * 認証方式変更時の処理
     */
    function changeAuthentication() {

        const authMethod =
            document.getElementById(
                "authMethod").value;

        const description =
            document.getElementById(
                "authDescription");

        const otpArea =
            document.getElementById(
                "otpArea");

        const form =
            document.getElementById(
                "attackForm");


        /*
         * 初期状態
         */
        otpArea.style.display = "none";


        /*
         * 一段階認証
         */
        if (authMethod === "one-stage") {

            description.innerHTML =
                "認証構成：<strong>"
                + "ID + Password"
                + "</strong><br>"
                + "認証操作回数：3回";

            form.action =
                "/attack/password";

            return;
        }


        /*
         * 二段階認証
         */
        if (authMethod === "two-stage") {

            description.innerHTML =
                "認証構成：<strong>"
                + "ID + Password → Password2"
                + "</strong><br>"
                + "認証操作回数：5回";

            form.action =
                "/attack/password";

            return;
        }


        /*
         * 三段階認証
         */
        if (authMethod === "three-stage") {

            description.innerHTML =
                "認証構成：<strong>"
                + "ID + Password → Password2 → Password3"
                + "</strong><br>"
                + "認証操作回数：7回";

            form.action =
                "/attack/password";

            return;
        }


        /*
         * 一要素 Password
         */
        if (
            authMethod ===
            "one-factor-password"
        ) {

            description.innerHTML =
                "認証構成：<strong>"
                + "ID + Password"
                + "</strong><br>"
                + "認証操作回数：3回";

            form.action =
                "/attack/factor";

            return;
        }


        /*
         * 一要素 Email OTP
         */
        if (
            authMethod ===
            "one-factor-email-otp"
        ) {

            description.innerHTML =
                "認証構成：<strong>"
                + "ID + Email OTP"
                + "</strong><br>"
                + "認証操作回数：3回";

            otpArea.style.display =
                "block";

            form.action =
                "/attack/factor";

            return;
        }


        /*
         * 二要素 Password + Email OTP
         */
        if (
            authMethod ===
            "two-factor-password-email-otp"
        ) {

            description.innerHTML =
                "認証構成：<strong>"
                + "ID + Password → Email OTP"
                + "</strong><br>"
                + "認証操作回数：5回";

            otpArea.style.display =
                "block";

            form.action =
                "/attack/factor";

            return;
        }

    }

</script>

</body>

</html>
