<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <title>攻撃実験</title>

    <style>

        body {
            font-family:
                "Yu Gothic",
                "Meiryo",
                sans-serif;

            background-color: #f5f7fa;

            margin: 0;

            padding: 30px;

            color: #333;
        }

        .container {
            width: 100%;

            max-width: 700px;

            margin: 0 auto;
        }

        h1 {
            text-align: center;

            margin-bottom: 30px;
        }

        .card {
            background-color: white;

            border-radius: 8px;

            padding: 25px;

            margin-bottom: 20px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;

            font-weight: bold;

            margin-bottom: 8px;
        }

        select,
        input[type="number"] {
            width: 100%;

            box-sizing: border-box;

            padding: 12px;

            font-size: 16px;

            border: 1px solid #ccc;

            border-radius: 5px;

            background-color: white;
        }

        select:focus,
        input[type="number"]:focus {
            outline: none;

            border-color: #0d6efd;
        }

        .attempt-area {
            border: 1px solid #ddd;

            border-radius: 6px;

            padding: 18px;

            background-color: #fafafa;

            margin-top: 15px;
        }

        .attempt-title {
            font-weight: bold;

            font-size: 16px;

            margin-bottom: 15px;
        }

        .attempt-group {
            margin-bottom: 15px;
        }

        .attempt-group:last-child {
            margin-bottom: 0;
        }

        .attempt-label {
            display: block;

            font-weight: normal;

            margin-bottom: 6px;
        }

        .help-text {
            color: #666;

            font-size: 13px;

            margin-top: 5px;
        }

        .hidden {
            display: none;
        }

        .button-area {
            margin-top: 25px;

            display: flex;

            gap: 10px;

            flex-wrap: wrap;
        }

        button,
        .result-button {
            border: none;

            border-radius: 5px;

            padding: 12px 20px;

            font-size: 15px;

            cursor: pointer;

            text-decoration: none;

            text-align: center;
        }

        .attack-button {
            background-color: #dc3545;

            color: white;
        }

        .attack-button:hover {
            background-color: #bb2d3b;
        }

        .result-button {
            background-color: #0d6efd;

            color: white;
        }

        .result-button:hover {
            background-color: #0b5ed7;
        }

        .user-info {
            padding: 12px;

            background-color: #f1f3f5;

            border-radius: 5px;

            color: #555;

            font-size: 14px;
        }

        .notice {
            margin-top: 15px;

            padding: 12px;

            background-color: #fff3cd;

            border: 1px solid #ffe69c;

            border-radius: 5px;

            color: #664d03;

            font-size: 14px;
        }

        @media (max-width: 600px) {

            body {
                padding: 15px;
            }

            .card {
                padding: 18px;
            }
        }

    </style>

</head>

<body>

<div class="container">

    <h1>攻撃実験</h1>

    <!-- ================================================== -->
    <!-- 攻撃対象設定 -->
    <!-- ================================================== -->

    <div class="card">

        <form
                id="attackForm"
                method="post">

            <!-- ========================================== -->
            <!-- 対象ユーザー -->
            <!-- ========================================== -->

            <div class="form-group">

                <label for="username">
                    対象ユーザー
                </label>

                <select
                        id="username"
                        name="username"
                        required>

                    <option value="">
                        ユーザーを選択してください
                    </option>

                    <option
                            th:each="username : ${usernames}"
                            th:value="${username}"
                            th:text="${username}">
                        username
                    </option>

                </select>

                <div class="help-text">
                    newauthlabに登録されているユーザーから選択します。
                </div>

            </div>


            <!-- ========================================== -->
            <!-- 認証方式 -->
            <!-- ========================================== -->

            <div class="form-group">

                <label for="authMethod">
                    認証方式
                </label>

                <select
                        id="authMethod"
                        name="authMethod"
                        required>

                    <option value="">
                        認証方式を選択してください
                    </option>

                    <option value="one-stage">
                        一段階認証（Password）
                    </option>

                    <option value="two-stage">
                        二段階認証（Password→Password2）
                    </option>

                    <option value="three-stage">
                        三段階認証（Password→Password2→Password3）
                    </option>

                    <option value="one-factor-password">
                        一要素認証（Password）
                    </option>

                    <option value="one-factor-email-otp">
                        一要素認証（Email OTP）
                    </option>

                    <option value="two-factor-password-email-otp">
                        二要素認証（Password + Email OTP）
                    </option>

                </select>

            </div>


            <!-- ========================================== -->
            <!-- 最大攻撃試行回数 -->
            <!-- ========================================== -->

            <div
                    id="attemptArea"
                    class="attempt-area hidden">

                <div class="attempt-title">
                    最大攻撃試行回数
                </div>


                <!-- ====================================== -->
                <!-- Password -->
                <!-- ====================================== -->

                <div
                        id="passwordAttemptGroup"
                        class="attempt-group hidden">

                    <label
                            for="maxAttemptsPassword"
                            class="attempt-label">

                        Password

                    </label>

                    <input
                            type="number"
                            id="maxAttemptsPassword"
                            name="maxAttemptsPassword"
                            value="10000"
                            min="1"
                            max="10000"
                            step="1">

                    <div class="help-text">
                        1～10000回
                    </div>

                </div>


                <!-- ====================================== -->
                <!-- Password2 -->
                <!-- ====================================== -->

                <div
                        id="password2AttemptGroup"
                        class="attempt-group hidden">

                    <label
                            for="maxAttemptsPassword2"
                            class="attempt-label">

                        Password2

                    </label>

                    <input
                            type="number"
                            id="maxAttemptsPassword2"
                            name="maxAttemptsPassword2"
                            value="10000"
                            min="1"
                            max="10000"
                            step="1">

                    <div class="help-text">
                        1～10000回
                    </div>

                </div>


                <!-- ====================================== -->
                <!-- Password3 -->
                <!-- ====================================== -->

                <div
                        id="password3AttemptGroup"
                        class="attempt-group hidden">

                    <label
                            for="maxAttemptsPassword3"
                            class="attempt-label">

                        Password3

                    </label>

                    <input
                            type="number"
                            id="maxAttemptsPassword3"
                            name="maxAttemptsPassword3"
                            value="10000"
                            min="1"
                            max="10000"
                            step="1">

                    <div class="help-text">
                        1～10000回
                    </div>

                </div>


                <!-- ====================================== -->
                <!-- Email OTP -->
                <!-- ====================================== -->

                <div
                        id="otpAttemptGroup"
                        class="attempt-group hidden">

                    <label
                            for="maxAttempts"
                            class="attempt-label">

                        Email OTP

                    </label>

                    <input
                            type="number"
                            id="maxAttempts"
                            name="maxAttempts"
                            value="1000000"
                            min="1"
                            max="1000000"
                            step="1">

                    <div class="help-text">
                        1～1000000回
                    </div>

                </div>

            </div>


            <!-- ========================================== -->
            <!-- 説明 -->
            <!-- ========================================== -->

            <div
                    id="description"
                    class="notice hidden">
            </div>


            <!-- ========================================== -->
            <!-- ボタン -->
            <!-- ========================================== -->

            <div class="button-area">

                <button
                        type="submit"
                        id="attackButton"
                        class="attack-button">

                    攻撃開始

                </button>

                <a
                        href="/results"
                        class="result-button">

                    実験結果

                </a>

            </div>

        </form>

    </div>


    <!-- ================================================== -->
    <!-- ユーザー情報 -->
    <!-- ================================================== -->

    <div class="card">

        <div class="user-info">

            選択したユーザーの認証情報は、
            newauthlabのデータベースから取得して攻撃実験に使用します。

        </div>

    </div>

</div>


<script>

    // =====================================================
    // HTML要素取得
    // =====================================================

    const authMethod =
        document.getElementById(
            "authMethod"
        );

    const attackForm =
        document.getElementById(
            "attackForm"
        );

    const attemptArea =
        document.getElementById(
            "attemptArea"
        );

    const passwordAttemptGroup =
        document.getElementById(
            "passwordAttemptGroup"
        );

    const password2AttemptGroup =
        document.getElementById(
            "password2AttemptGroup"
        );

    const password3AttemptGroup =
        document.getElementById(
            "password3AttemptGroup"
        );

    const otpAttemptGroup =
        document.getElementById(
            "otpAttemptGroup"
        );

    const description =
        document.getElementById(
            "description"
        );


    // =====================================================
    // 初期状態
    // =====================================================

    function resetAttemptArea() {

        attemptArea.classList.add(
            "hidden"
        );

        passwordAttemptGroup.classList.add(
            "hidden"
        );

        password2AttemptGroup.classList.add(
            "hidden"
        );

        password3AttemptGroup.classList.add(
            "hidden"
        );

        otpAttemptGroup.classList.add(
            "hidden"
        );

        description.classList.add(
            "hidden"
        );

        description.textContent = "";

    }


    // =====================================================
    // 認証方式変更
    // =====================================================

    function updateAttemptFields() {

        const method =
            authMethod.value;

        resetAttemptArea();


        // ================================================
        // 認証方式未選択
        // ================================================

        if (!method) {
            attackForm.action = "";
            return;
        }


        // ================================================
        // 一段階認証
        // ================================================

        if (method === "one-stage") {

            attemptArea.classList.remove(
                "hidden"
            );

            passwordAttemptGroup.classList.remove(
                "hidden"
            );

            description.classList.remove(
                "hidden"
            );

            description.textContent =
                "Passwordの最大攻撃試行回数を設定します。";

            attackForm.action =
                "/attack/multi-stage";

            return;
        }


        // ================================================
        // 二段階認証
        // ================================================

        if (method === "two-stage") {

            attemptArea.classList.remove(
                "hidden"
            );

            passwordAttemptGroup.classList.remove(
                "hidden"
            );

            password2AttemptGroup.classList.remove(
                "hidden"
            );

            description.classList.remove(
                "hidden"
            );

            description.textContent =
                "PasswordとPassword2の最大攻撃試行回数をそれぞれ設定します。";

            attackForm.action =
                "/attack/multi-stage";

            return;
        }


        // ================================================
        // 三段階認証
        // ================================================

        if (method === "three-stage") {

            attemptArea.classList.remove(
                "hidden"
            );

            passwordAttemptGroup.classList.remove(
                "hidden"
            );

            password2AttemptGroup.classList.remove(
                "hidden"
            );

            password3AttemptGroup.classList.remove(
                "hidden"
            );

            description.classList.remove(
                "hidden"
            );

            description.textContent =
                "Password、Password2、Password3の最大攻撃試行回数をそれぞれ設定します。";

            attackForm.action =
                "/attack/multi-stage";

            return;
        }


        // ================================================
        // 一要素認証 Password
        // ================================================

        if (method === "one-factor-password") {

            attemptArea.classList.remove(
                "hidden"
            );

            passwordAttemptGroup.classList.remove(
                "hidden"
            );

            description.classList.remove(
                "hidden"
            );

            description.textContent =
                "Passwordの最大攻撃試行回数を設定します。";

            attackForm.action =
                "/attack/factor";

            return;
        }


        // ================================================
        // 一要素認証 Email OTP
        // ================================================

        if (method === "one-factor-email-otp") {

            attemptArea.classList.remove(
                "hidden"
            );

            otpAttemptGroup.classList.remove(
                "hidden"
            );

            description.classList.remove(
                "hidden"
            );

            description.textContent =
                "Email OTPの最大攻撃試行回数を設定します。";

            attackForm.action =
                "/attack/factor";

            return;
        }


        // ================================================
        // 二要素認証
        // Password + Email OTP
        // ================================================

        if (
            method ===
            "two-factor-password-email-otp"
        ) {

            attemptArea.classList.remove(
                "hidden"
            );

            passwordAttemptGroup.classList.remove(
                "hidden"
            );

            otpAttemptGroup.classList.remove(
                "hidden"
            );

            description.classList.remove(
                "hidden"
            );

            description.textContent =
                "PasswordとEmail OTPの最大攻撃試行回数をそれぞれ設定します。";

            attackForm.action =
                "/attack/factor";

            return;
        }

    }


    // =====================================================
    // 入力値チェック
    // =====================================================

    attackForm.addEventListener(
        "submit",
        function (event) {

            const method =
                authMethod.value;


            // ============================================
            // Password
            // ============================================

            const passwordValue =
                document.getElementById(
                    "maxAttemptsPassword"
                ).value;

            if (
                method === "one-stage"
                ||
                method === "two-stage"
                ||
                method === "three-stage"
                ||
                method === "one-factor-password"
                ||
                method ===
                "two-factor-password-email-otp"
            ) {

                const value =
                    Number(passwordValue);

                if (
                    !Number.isInteger(value)
                    ||
                    value < 1
                    ||
                    value > 10000
                ) {

                    event.preventDefault();

                    alert(
                        "Passwordの最大攻撃試行回数は1～10000の範囲で指定してください。"
                    );

                    return;
                }
            }


            // ============================================
            // Password2
            // ============================================

            const password2Value =
                document.getElementById(
                    "maxAttemptsPassword2"
                ).value;

            if (
                method === "two-stage"
                ||
                method === "three-stage"
            ) {

                const value =
                    Number(password2Value);

                if (
                    !Number.isInteger(value)
                    ||
                    value < 1
                    ||
                    value > 10000
                ) {

                    event.preventDefault();

                    alert(
                        "Password2の最大攻撃試行回数は1～10000の範囲で指定してください。"
                    );

                    return;
                }
            }


            // ============================================
            // Password3
            // ============================================

            const password3Value =
                document.getElementById(
                    "maxAttemptsPassword3"
                ).value;

            if (
                method === "three-stage"
            ) {

                const value =
                    Number(password3Value);

                if (
                    !Number.isInteger(value)
                    ||
                    value < 1
                    ||
                    value > 10000
                ) {

                    event.preventDefault();

                    alert(
                        "Password3の最大攻撃試行回数は1～10000の範囲で指定してください。"
                    );

                    return;
                }
            }


            // ============================================
            // Email OTP
            // ============================================

            const otpValue =
                document.getElementById(
                    "maxAttempts"
                ).value;

            if (
                method === "one-factor-email-otp"
                ||
                method ===
                "two-factor-password-email-otp"
            ) {

                const value =
                    Number(otpValue);

                if (
                    !Number.isInteger(value)
                    ||
                    value < 1
                    ||
                    value > 1000000
                ) {

                    event.preventDefault();

                    alert(
                        "Email OTPの最大攻撃試行回数は1～1000000の範囲で指定してください。"
                    );

                    return;
                }
            }

        }
    );


    // =====================================================
    // 認証方式変更時
    // =====================================================

    authMethod.addEventListener(
        "change",
        updateAttemptFields
    );


    // =====================================================
    // 初期表示
    // =====================================================

    updateAttemptFields();

</script>

</body>

</html>
